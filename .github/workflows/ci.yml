name: Offline tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Syntax check
        run: python -m compileall -q jmcomic_gui.py src
      - name: Run offline PDF tests
        run: python -m unittest tests.test_jmcomic_gui_pdf

  browser-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run extension tests
        working-directory: browser-extension
        run: npm test
