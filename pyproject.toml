[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmcomic-downloader-gui"
version = "1.2.0"
description = "Windows GUI downloader with lossless PDF export and a Chromium tab collector, based on JMComic-Crawler-Python."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "JMComic-Downloader-GUI contributors"},
]
keywords = ["jmcomic", "downloader", "gui", "pdf", "chromium-extension"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "commonx>=0.6.38",
  "curl-cffi",
  "img2pdf",
  "Pillow",
  "pycryptodome",
  "pypdf",
  "PyYAML",
  "requests",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]
test = [
  "Pillow",
  "pypdf",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
